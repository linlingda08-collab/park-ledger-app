<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公園デジタル台帳システム - 公園台帳モジュール</title>
  <!-- アイコン設定 -->
  <link rel="icon" href="icon.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="icon.jpg">
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Leaflet.js (地図ライブラリ) CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans JP', 'Inter', sans-serif; }
    #map { z-index: 1; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-emerald-800 text-white shadow-md border-b border-emerald-900 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
        <div class="flex items-center space-x-3">
          <img src="icon.jpg" alt="アプリアイコン" class="w-9 h-9 rounded-lg object-cover border border-emerald-600 shadow-sm">
          <div>
            <h1 class="text-xl font-bold tracking-wide">公園デジタル台帳システム</h1>
            <p class="text-xs text-emerald-200">内部DX基盤 ＞ GIS地図・公園台帳管理</p>
          </div>
        </div>
      </div>

      <!-- メイン表示タブ切り替え -->
      <div class="flex items-center space-x-1 bg-emerald-900/80 p-1 rounded-lg border border-emerald-700/60 text-xs w-full sm:w-auto justify-center">
        <button id="tabMapBtn" onclick="switchView('map')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-md font-bold transition bg-emerald-600 text-white shadow-sm">
          <i data-lucide="map" class="w-4 h-4"></i>
          マップ表示
        </button>
        <button id="tabDetailBtn" onclick="switchView('detail')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-md font-bold transition text-emerald-200 hover:text-white hover:bg-emerald-800">
          <i data-lucide="file-text" class="w-4 h-4"></i>
          台帳詳細
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- 左側：公園選択・検索パネル -->
    <section class="lg:col-span-4 bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col h-fit">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
        <h2 class="font-bold text-slate-700 flex items-center gap-2">
          <i data-lucide="search" class="w-4 h-4 text-emerald-600"></i>
          公園選択・検索
        </h2>
        <button onclick="openModal()" class="inline-flex items-center gap-1 text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-2.5 py-1.5 rounded-lg transition">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          新規公園追加
        </button>
      </div>

      <!-- フィルター・ソートコントロール -->
      <div class="space-y-3 mb-4">
        <div>
          <label class="text-xs font-semibold text-slate-500 mb-1 block">並び順（ソート）</label>
          <select id="sortSelect" onchange="renderParkList()" class="w-full text-sm bg-slate-50 border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <option value="kana-asc">名称順（あいうえお順）</option>
            <option value="area-desc">敷地面積が広い順</option>
            <option value="area-asc">敷地面積が狭い順</option>
            <option value="date-asc">設置年月日が古い順（開設順）</option>
            <option value="date-desc">設置年月日が新しい順</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-semibold text-slate-500 mb-1 block">公園プルダウン選択</label>
          <select id="parkDropdown" onchange="selectParkFromDropdown(this.value)" class="w-full text-sm bg-emerald-50 font-medium text-emerald-900 border border-emerald-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <!-- JavaScriptで動的生成 -->
          </select>
        </div>

        <div class="relative">
          <input type="text" id="searchInput" oninput="renderParkList()" placeholder="公園名や所在地でフリー検索..." class="w-full text-sm pl-9 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
        </div>
      </div>

      <!-- 公園カードリスト -->
      <div class="space-y-2 max-h-[520px] overflow-y-auto pr-1" id="parkListContainer">
        <!-- JavaScriptで動的生成 -->
      </div>
    </section>

    <!-- 右側：メインコンテンツ表示パネル (地図 or 台帳詳細) -->
    <section class="lg:col-span-8 bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-6 flex flex-col min-h-[550px]">
      
      <!-- View 1: GISマップ表示エリア (起動時デフォルト) -->
      <div id="mapViewSection" class="w-full h-full flex flex-col flex-1">
        <div class="flex justify-between items-center pb-3 mb-3 border-b border-slate-100">
          <h2 class="font-bold text-slate-700 flex items-center gap-2 text-sm sm:text-base">
            <i data-lucide="map-pin" class="w-4 h-4 text-emerald-600"></i>
            公園GISマップビュー
          </h2>
          <span class="text-xs text-slate-400">ピンをタップすると公園概要が表示されます</span>
        </div>
        <div id="map" class="w-full h-[480px] rounded-lg border border-slate-200 shadow-inner"></div>
      </div>

      <!-- View 2: 都市公園台帳 詳細表示エリア -->
      <div id="detailViewSection" class="w-full h-full flex flex-col justify-between hidden">
        <!-- 詳細データはJavaScriptで動的描画 -->
      </div>

    </section>

  </main>

  <!-- 公園新規登録・編集モーダルダイアログ -->
  <div id="parkModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-2xl border border-slate-200 max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6">
      <div class="flex justify-between items-center pb-3 border-b border-slate-200 mb-4">
        <h3 class="text-lg font-bold text-slate-800" id="modalTitle">都市公園台帳の追加</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <form id="parkForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="editParkId">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">公園名称 <span class="text-red-500">*</span></label>
            <input type="text" id="inputName" required placeholder="例: さくら中央公園" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">フリガナ（五十音順用） <span class="text-red-500">*</span></label>
            <input type="text" id="inputKana" required placeholder="例: サクラチュウオウコウエン" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-xs font-bold text-slate-700">公園種別</label>
              <button type="button" onclick="openCustomTypeModal()" class="text-[11px] text-emerald-600 hover:underline flex items-center gap-0.5">
                <i data-lucide="settings" class="w-3 h-3"></i> 種別管理
              </button>
            </div>
            <select id="inputType" onchange="checkCustomTypeSelect(this.value)" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
              <!-- JavaScriptで動的生成 -->
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">設置年月日（供用開始日）</label>
            <input type="date" id="inputEstDate" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">所在地</label>
          <input type="text" id="inputAddress" placeholder="例: 愛知県名古屋市中区二の丸1" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">敷地面積 (㎡)</label>
            <input type="number" step="0.01" id="inputArea" placeholder="1500" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">緯度 (Latitude) <span class="text-red-500">*</span></label>
            <input type="number" step="0.000001" id="inputLat" required placeholder="35.1802" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">経度 (Longitude) <span class="text-red-500">*</span></label>
            <input type="number" step="0.000001" id="inputLng" required placeholder="136.9066" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">土地所有者・権利関係</label>
          <input type="text" id="inputOwner" placeholder="例: 市有地 (100%) / 一部国有地借地" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">沿革・変遷メモ</label>
          <textarea id="inputHistory" rows="3" placeholder="例: 昭和55年開設。平成20年に複合遊具全面改修。" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
        </div>

        <div class="flex justify-end space-x-2 pt-4 border-t border-slate-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg">キャンセル</button>
          <button type="submit" class="px-4 py-2 text-sm font-medium bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg shadow-sm">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 自治体独自公園種別の管理モーダル -->
  <div id="customTypeModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-2xl border border-slate-200 max-w-md w-full p-6">
      <div class="flex justify-between items-center pb-3 border-b border-slate-200 mb-4">
        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5 text-emerald-600"></i>
          独自公園種別の管理
        </h3>
        <button onclick="closeCustomTypeModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">新しいオリジナル種別名を追加</label>
          <div class="flex gap-2">
            <input type="text" id="newCustomTypeInput" placeholder="例: 防災公園, ポケットパーク" class="flex-1 text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
            <button type="button" onclick="addCustomType()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg transition flex-shrink-0">追加</button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 mb-2">登録済みの独自種別一覧</label>
          <div id="customTypeListContainer" class="space-y-1.5 max-h-40 overflow-y-auto pr-1">
            <!-- JavaScriptで動的生成 -->
          </div>
        </div>
      </div>

      <div class="mt-6 pt-3 border-t border-slate-100 flex justify-end">
        <button type="button" onclick="closeCustomTypeModal()" class="px-4 py-2 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    // 国土交通省の標準公園種別定義
    const mlitParkCategories = [
      {
        category: "住区基幹公園",
        types: [
          { name: "街区公園", desc: "主として街区内に居住する者の利用に供する公園 (標準面積 0.25ha)" },
          { name: "近隣公園", desc: "主として近隣に居住する者の利用に供する公園 (標準面積 2ha)" },
          { name: "地区公園", desc: "主として徒歩圏内に居住する者の利用に供する公園 (標準面積 4ha)" }
        ]
      },
      {
        category: "都市基幹公園",
        types: [
          { name: "総合公園", desc: "都市住民全般の休息、鑑賞、散歩、運動等に供する公園 (標準面積 10〜50ha)" },
          { name: "運動公園", desc: "都市住民全般の主として運動の用に供する公園 (標準面積 15〜75ha)" }
        ]
      },
      {
        category: "大規模公園",
        types: [
          { name: "広域公園", desc: "広域のレクリエーション需要を充足することを目的とする公園 (標準面積 50ha以上)" },
          { name: "レクリエーション都市", desc: "拠点的に整備される広域的な公園" }
        ]
      },
      {
        category: "国営公園",
        types: [
          { name: "国営公園", desc: "国家的な記念事業等として設置される大規模な公園" }
        ]
      },
      {
        category: "特殊公園",
        types: [
          { name: "特殊公園", desc: "風致公園、動物公園、植物園、歴史公園、墓園等" }
        ]
      },
      {
        category: "緩衝緑地等（緑地系）",
        types: [
          { name: "緩衝緑地", desc: "公害・災害防止等を目的とする緑地" },
          { name: "都市緑地", desc: "都市の自然環境の保全ならびに緑化の向上を図る緑地" },
          { name: "緑道", desc: "災害時における避難路の確保や散策を目的とする帯状の緑地" }
        ]
      }
    ];

    // 自治体独自の追加種別
    let customTypes = JSON.parse(localStorage.getItem('park_custom_types')) || ["ポケットパーク", "市民農園", "防災公園"];

    // 初期サンプルデータ (緯度・経度付き)
    const initialParks = [
      {
        id: "park-001",
        name: "あおい中央公園",
        kana: "アオイチユウオウコウエン",
        type: "総合公園",
        address: "愛知県名古屋市中区二の丸1",
        estDate: "1985-04-01",
        area: 24500.00,
        lat: 35.1848,
        lng: 136.9022,
        owner: "市有地 (100%)",
        history: "昭和60年供用開始。平成15年に多目的広場整備、令和2年に防災備蓄倉庫設置。"
      },
      {
        id: "park-002",
        name: "いずみ街区公園",
        kana: "イズミガイクコウエン",
        type: "街区公園",
        address: "愛知県名古屋市東区泉1-8",
        estDate: "1992-10-15",
        area: 1200.50,
        lat: 35.1762,
        lng: 136.9095,
        owner: "市有地 (100%)",
        history: "平成4年土地区画整理事業に伴い開設。"
      },
      {
        id: "park-003",
        name: "うめつぼ緑地公園",
        kana: "ウメツボリョクチコウエン",
        type: "近隣公園",
        address: "愛知県豊田市梅坪町3-12",
        estDate: "2005-06-01",
        area: 8900.00,
        lat: 35.1015,
        lng: 137.1580,
        owner: "市有地 80%、民間借地 20%",
        history: "平成17年開設。市民ボランティア（愛護会）による樹木管理が活発。"
      }
    ];

    // グローバル変数
    let parks = JSON.parse(localStorage.getItem('park_ledgers')) || initialParks;
    let selectedParkId = parks[0]?.id || null;
    let currentView = 'map'; // 'map' or 'detail'
    let map = null;
    let markersMap = {};

    // 初期化処理
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      populateTypeSelect();
      renderParkList();
      initMap();
      if (selectedParkId) {
        renderParkDetail(selectedParkId);
      }
    });

    // データの保存
    function saveParks() {
      localStorage.setItem('park_ledgers', JSON.stringify(parks));
    }

    function saveCustomTypes() {
      localStorage.setItem('park_custom_types', JSON.stringify(customTypes));
    }

    // 地図 (Leaflet.js) 初期化処理
    function initMap() {
      if (map) return;

      // 初期中心座標 (愛知県周辺)
      const initialLat = parks[0]?.lat || 35.1802;
      const initialLng = parks[0]?.lng || 136.9066;

      map = L.map('map').setView([initialLat, initialLng], 12);

      // 国土地理院風のオープンストリートマップタイル
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      updateMapMarkers();
    }

    // 地図のピン（マーカー）の更新
    function updateMapMarkers() {
      if (!map) return;

      // 既存マーカーの削除
      Object.values(markersMap).forEach(m => map.removeLayer(m));
      markersMap = {};

      const sortedParks = getSortedParks();

      sortedParks.forEach(p => {
        if (p.lat && p.lng) {
          const marker = L.marker([p.lat, p.lng]).addTo(map);
          
          const popupContent = `
            <div class="p-1">
              <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.5 rounded">${p.type}</span>
              <h4 class="font-bold text-sm text-slate-800 mt-1">${p.name}</h4>
              <p class="text-xs text-slate-500 mt-0.5">${p.address || ''}</p>
              <p class="text-xs text-slate-500">面積: ${p.area ? p.area.toLocaleString() + ' ㎡' : '-'}</p>
              <button onclick="focusParkDetailFromMap('${p.id}')" class="mt-2 w-full text-center text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1 px-2 rounded shadow-sm">
                詳細台帳を見る →
              </button>
            </div>
          `;
          
          marker.bindPopup(popupContent);
          marker.on('click', () => {
            selectedParkId = p.id;
            renderParkList();
            renderParkDetail(p.id);
          });

          markersMap[p.id] = marker;
        }
      });
    }

    // 地図のポップアップから詳細へジャンプ
    function focusParkDetailFromMap(id) {
      selectedParkId = id;
      switchView('detail');
      renderParkDetail(id);
    }

    // ビュー切り替え (マップ ⇔ 台帳詳細)
    function switchView(viewName) {
      currentView = viewName;
      const mapViewSection = document.getElementById('mapViewSection');
      const detailViewSection = document.getElementById('detailViewSection');
      const tabMapBtn = document.getElementById('tabMapBtn');
      const tabDetailBtn = document.getElementById('tabDetailBtn');

      if (viewName === 'map') {
        mapViewSection.classList.remove('hidden');
        detailViewSection.classList.add('hidden');
        
        tabMapBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-md font-bold transition bg-emerald-600 text-white shadow-sm";
        tabDetailBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-md font-bold transition text-emerald-200 hover:text-white hover:bg-emerald-800";

        // 地図のリサイズ（非表示からの復帰時崩れ防止）
        setTimeout(() => {
          if (map) map.invalidateSize();
        }, 100);

      } else {
        mapViewSection.classList.add('hidden');
        detailViewSection.classList.remove('hidden');

        tabDetailBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-md font-bold transition bg-emerald-600 text-white shadow-sm";
        tabMapBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-md font-bold transition text-emerald-200 hover:text-white hover:bg-emerald-800";
      }
    }

    // 種別プルダウン選択肢生成
    function populateTypeSelect() {
      const select = document.getElementById('inputType');
      let html = '';

      mlitParkCategories.forEach(cat => {
        html += `<optgroup label="【${cat.category}】">`;
        cat.types.forEach(t => {
          html += `<option value="${t.name}">${t.name}</option>`;
        });
        html += `</optgroup>`;
      });

      if (customTypes.length > 0) {
        html += `<optgroup label="【自治体独自区分】">`;
        customTypes.forEach(ct => {
          html += `<option value="${ct}">${ct}</option>`;
        });
        html += `</optgroup>`;
      }

      html += `<optgroup label="【操作】">`;
      html += `<option value="__ADD_NEW_TYPE__">+ 自治体独自の種別を追加...</option>`;
      html += `</optgroup>`;

      select.innerHTML = html;
    }

    function checkCustomTypeSelect(val) {
      if (val === '__ADD_NEW_TYPE__') {
        openCustomTypeModal();
        populateTypeSelect();
      }
    }

    // 独自種別モーダル
    function openCustomTypeModal() {
      renderCustomTypeList();
      document.getElementById('customTypeModal').classList.remove('hidden');
      document.getElementById('customTypeModal').classList.add('flex');
    }

    function closeCustomTypeModal() {
      document.getElementById('customTypeModal').classList.add('hidden');
      document.getElementById('customTypeModal').classList.remove('flex');
      populateTypeSelect();
    }

    function renderCustomTypeList() {
      const container = document.getElementById('customTypeListContainer');
      if (customTypes.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 py-2">登録されている独自種別はありません</p>`;
        return;
      }

      container.innerHTML = customTypes.map((ct, idx) => `
        <div class="flex justify-between items-center bg-slate-50 border border-slate-200 px-2.5 py-1.5 rounded-lg text-xs">
          <span class="font-medium text-slate-700">${ct}</span>
          <button type="button" onclick="removeCustomType(${idx})" class="text-red-500 hover:text-red-700">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function addCustomType() {
      const input = document.getElementById('newCustomTypeInput');
      const val = input.value.trim();
      if (!val) return;

      if (!customTypes.includes(val)) {
        customTypes.push(val);
        saveCustomTypes();
        renderCustomTypeList();
        populateTypeSelect();
        document.getElementById('inputType').value = val;
      }
      input.value = '';
    }

    function removeCustomType(idx) {
      customTypes.splice(idx, 1);
      saveCustomTypes();
      renderCustomTypeList();
      populateTypeSelect();
    }

    // ソート処理
    function getSortedParks() {
      const sortType = document.getElementById('sortSelect').value;
      const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();

      let filtered = parks.filter(p => 
        p.name.toLowerCase().includes(searchKeyword) || 
        p.address.toLowerCase().includes(searchKeyword) ||
        p.kana.toLowerCase().includes(searchKeyword) ||
        p.type.toLowerCase().includes(searchKeyword)
      );

      return filtered.sort((a, b) => {
        if (sortType === 'kana-asc') return a.kana.localeCompare(b.kana, 'ja');
        if (sortType === 'area-desc') return b.area - a.area;
        if (sortType === 'area-asc') return a.area - b.area;
        if (sortType === 'date-asc') return new Date(a.estDate) - new Date(b.estDate);
        if (sortType === 'date-desc') return new Date(b.estDate) - new Date(a.estDate);
        return 0;
      });
    }

    // 左側：公園リスト＆プルダウン描画
    function renderParkList() {
      const sortedParks = getSortedParks();
      const listContainer = document.getElementById('parkListContainer');
      const dropdown = document.getElementById('parkDropdown');

      dropdown.innerHTML = sortedParks.map(p => 
        `<option value="${p.id}" ${p.id === selectedParkId ? 'selected' : ''}>${p.name} (${p.area.toLocaleString()}㎡)</option>`
      ).join('');

      if (sortedParks.length === 0) {
        listContainer.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">該当する公園が見つかりません</div>`;
        return;
      }

      listContainer.innerHTML = sortedParks.map(p => {
        const isSelected = p.id === selectedParkId;
        return `
          <div onclick="selectPark('${p.id}')" class="p-3 rounded-lg border cursor-pointer transition ${isSelected ? 'bg-emerald-50 border-emerald-500 shadow-sm' : 'bg-white border-slate-200 hover:border-slate-300 hover:bg-slate-50'}">
            <div class="flex justify-between items-start">
              <h3 class="font-bold text-sm text-slate-800">${p.name}</h3>
              <span class="text-[10px] px-2 py-0.5 rounded font-medium ${isSelected ? 'bg-emerald-200 text-emerald-800' : 'bg-slate-100 text-slate-600'}">${p.type}</span>
            </div>
            <p class="text-xs text-slate-500 mt-1 truncate"><i data-lucide="map-pin" class="w-3 h-3 inline mr-1"></i>${p.address}</p>
            <div class="flex justify-between items-center mt-2 text-[11px] text-slate-400">
              <span>面積: ${p.area ? p.area.toLocaleString() + ' ㎡' : '-'}</span>
              <span>開設: ${p.estDate || '-'}</span>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // 公園選択アクション (リスト or プルダウンより)
    function selectPark(id) {
      selectedParkId = id;
      renderParkList();
      renderParkDetail(id);

      // 地図の中心をその公園へズーム移動
      const park = parks.find(p => p.id === id);
      if (park && park.lat && park.lng && map) {
        map.flyTo([park.lat, park.lng], 15, { duration: 1 });
        if (markersMap[id]) {
          markersMap[id].openPopup();
        }
      }
    }

    function selectParkFromDropdown(id) {
      selectPark(id);
    }

    // 右側：都市公園台帳 詳細画面描画
    function renderParkDetail(id) {
      const park = parks.find(p => p.id === id);
      const detailSection = document.getElementById('detailViewSection');

      if (!park) {
        detailSection.innerHTML = `<div class="text-center py-12 text-slate-400">公園を選択してください</div>`;
        return;
      }

      detailSection.innerHTML = `
        <div>
          <!-- ヘッダーエリア -->
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-4 border-b border-slate-200 gap-2">
            <div>
              <div class="flex items-center gap-2">
                <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">${park.type}</span>
                <span class="text-xs text-slate-400 font-mono">ID: ${park.id}</span>
              </div>
              <h2 class="text-2xl font-bold text-slate-800 mt-1">${park.name}</h2>
              <p class="text-xs text-slate-400 font-mono">${park.kana}</p>
            </div>
            <div class="flex space-x-2">
              <button onclick="switchView('map')" class="inline-flex items-center gap-1 text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-medium px-3 py-2 rounded-lg transition border border-emerald-200">
                <i data-lucide="map" class="w-3.5 h-3.5"></i>
                地図で位置確認
              </button>
              <button onclick="openModal('${park.id}')" class="inline-flex items-center gap-1 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-2 rounded-lg transition border border-slate-300">
                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                編集
              </button>
              <button onclick="deletePark('${park.id}')" class="inline-flex items-center gap-1 text-xs bg-red-50 hover:bg-red-100 text-red-600 font-medium px-3 py-2 rounded-lg transition border border-red-200">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                削除
              </button>
            </div>
          </div>

          <!-- 都市公園台帳 規定項目グリッド -->
          <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- 基本属性情報 -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
              <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5 border-b border-slate-200 pb-2">
                <i data-lucide="file-text" class="w-4 h-4 text-emerald-600"></i>
                基本・土地スペック
              </h3>
              
              <div class="grid grid-cols-3 text-xs">
                <span class="text-slate-500 font-medium">所在地:</span>
                <span class="col-span-2 font-semibold text-slate-800">${park.address || '未設定'}</span>
              </div>

              <div class="grid grid-cols-3 text-xs">
                <span class="text-slate-500 font-medium">敷地面積:</span>
                <span class="col-span-2 font-semibold text-slate-800">${park.area ? park.area.toLocaleString() + ' ㎡' : '未設定'}</span>
              </div>

              <div class="grid grid-cols-3 text-xs">
                <span class="text-slate-500 font-medium">設置年月日:</span>
                <span class="col-span-2 font-semibold text-slate-800">${park.estDate || '未設定'}</span>
              </div>

              <div class="grid grid-cols-3 text-xs">
                <span class="text-slate-500 font-medium">土地所有者:</span>
                <span class="col-span-2 font-semibold text-slate-800">${park.owner || '未設定'}</span>
              </div>
            </div>

            <!-- 位置・GIS情報 -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
              <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5 border-b border-slate-200 pb-2">
                <i data-lucide="map-pin" class="w-4 h-4 text-emerald-600"></i>
                位置座標 (GIS座標)
              </h3>

              <div class="grid grid-cols-3 text-xs">
                <span class="text-slate-500 font-medium">緯度 (Latitude):</span>
                <span class="col-span-2 font-mono text-slate-800">${park.lat || '未設定'}</span>
              </div>

              <div class="grid grid-cols-3 text-xs">
                <span class="text-slate-500 font-medium">経度 (Longitude):</span>
                <span class="col-span-2 font-mono text-slate-800">${park.lng || '未設定'}</span>
              </div>

              <div class="mt-3 p-3 bg-white rounded-lg border border-slate-200 text-xs text-emerald-800 flex items-center justify-between">
                <span class="flex items-center gap-1.5">
                  <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600"></i>
                  GIS地図への描画設定済み
                </span>
                <button onclick="switchView('map')" class="text-[11px] underline font-bold">マップを開く</button>
              </div>
            </div>

            <!-- 沿革・歴史メモ -->
            <div class="md:col-span-2 bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
              <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5 border-b border-slate-200 pb-2">
                <i data-lucide="history" class="w-4 h-4 text-emerald-600"></i>
                沿革・変遷・特記事項
              </h3>
              <p class="text-xs text-slate-700 whitespace-pre-wrap leading-relaxed">${park.history || '沿革情報はまだ登録されていません。'}</p>
            </div>

          </div>
        </div>

        <!-- 関連モジュール領域 -->
        <div class="mt-8 pt-4 border-t border-slate-200 bg-emerald-50/50 rounded-xl p-4 border border-dashed border-emerald-300">
          <div class="flex items-center justify-between text-xs text-emerald-800">
            <span class="font-bold flex items-center gap-1">
              <i data-lucide="layers" class="w-4 h-4"></i>
              関連モジュール接続準備完了
            </span>
            <span class="text-emerald-600">次回追加予定: 施設・遊具台帳 / 苦情要望履歴</span>
          </div>
        </div>
      `;

      lucide.createIcons();
    }

    // モーダル処理
    function openModal(editId = null) {
      populateTypeSelect();
      const modal = document.getElementById('parkModal');
      const form = document.getElementById('parkForm');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      if (editId) {
        document.getElementById('modalTitle').innerText = "都市公園台帳の編集";
        const p = parks.find(x => x.id === editId);
        document.getElementById('editParkId').value = p.id;
        document.getElementById('inputName').value = p.name;
        document.getElementById('inputKana').value = p.kana;
        document.getElementById('inputType').value = p.type;
        document.getElementById('inputEstDate').value = p.estDate || '';
        document.getElementById('inputAddress').value = p.address || '';
        document.getElementById('inputArea').value = p.area || '';
        document.getElementById('inputLat').value = p.lat || '';
        document.getElementById('inputLng').value = p.lng || '';
        document.getElementById('inputOwner').value = p.owner || '';
        document.getElementById('inputHistory').value = p.history || '';
      } else {
        document.getElementById('modalTitle').innerText = "都市公園台帳の追加";
        form.reset();
        document.getElementById('editParkId').value = '';
      }
    }

    function closeModal() {
      document.getElementById('parkModal').classList.add('hidden');
      document.getElementById('parkModal').classList.remove('flex');
    }

    // フォーム送信
    function handleFormSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('editParkId').value;

      const parkData = {
        id: editId || `park-${Date.now()}`,
        name: document.getElementById('inputName').value,
        kana: document.getElementById('inputKana').value,
        type: document.getElementById('inputType').value,
        estDate: document.getElementById('inputEstDate').value,
        address: document.getElementById('inputAddress').value,
        area: parseFloat(document.getElementById('inputArea').value) || 0,
        lat: parseFloat(document.getElementById('inputLat').value) || null,
        lng: parseFloat(document.getElementById('inputLng').value) || null,
        owner: document.getElementById('inputOwner').value,
        history: document.getElementById('inputHistory').value
      };

      if (editId) {
        const idx = parks.findIndex(p => p.id === editId);
        if (idx !== -1) parks[idx] = parkData;
      } else {
        parks.push(parkData);
        selectedParkId = parkData.id;
      }

      saveParks();
      closeModal();
      renderParkList();
      updateMapMarkers();
      renderParkDetail(selectedParkId);

      // 地図を新規追加・編集した公園へ移動
      if (parkData.lat && parkData.lng && map) {
        map.flyTo([parkData.lat, parkData.lng], 15);
      }
    }

    // 削除処理
    function deletePark(id) {
      if (!confirm('この公園データを台帳から削除してもよろしいですか？')) return;
      parks = parks.filter(p => p.id !== id);
      if (selectedParkId === id) {
        selectedParkId = parks[0]?.id || null;
      }
      saveParks();
      renderParkList();
      updateMapMarkers();
      if (selectedParkId) renderParkDetail(selectedParkId);
      else document.getElementById('detailViewSection').innerHTML = `<div class="text-center py-12 text-slate-400">公園が登録されていません</div>`;
    }
  </script>
</body>
</html>
